name: Wöchentliche Datensammlung

on:
  schedule:
    # Sonntag 18:00 UTC, damit die Daten vor dem Montagslauf des Bedarfsradars bereitliegen
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      skip_trends:
        description: "Google Trends überspringen (nur Stellenanzeigen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests trendspyg

      - name: Daten sammeln
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SKIP_TRENDS: ${{ inputs.skip_trends && '1' || '0' }}
        run: python scripts/collect.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "demand-radar-bot"
          git config user.email "demand-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten $(date -u +%F)"
            git push
          fi
