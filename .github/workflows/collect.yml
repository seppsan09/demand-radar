name: Wöchentliche Datensammlung

on:
  schedule:
    # Sonntag 18:00 UTC, damit die Daten vor dem Montagslauf des Bedarfsradars bereitliegen
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      skip_trends:
        description: "Google Trends überspringen (nur Stellenanzeigen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests trendspyg

      - name: Daten sammeln
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Verwandte Suchanfragen ueber SerpApi kosten eine zweite Abfrage je
          # Begriff. Zum Einschalten die Repository-Variable auf 1 setzen.
          SERPAPI_RELATED: ${{ vars.SERPAPI_RELATED }}
          # Pause zwischen den Trends-Begriffen in Sekunden. Leer = 25 ueber den
          # Browserweg, 1 mit SerpApi-Schluessel. Hochsetzen, wenn der Tarif eine
          # niedrige Durchsatzgrenze hat (kostenloser Tarif: 50 Abfragen/Stunde).
          TRENDS_PAUSE: ${{ vars.TRENDS_PAUSE }}
          # Stundendurchsatz des SerpApi-Tarifs; ohne Angabe wird der
          # kostenlose Tarif mit 50 angenommen.
          SERPAPI_THROUGHPUT: ${{ vars.SERPAPI_THROUGHPUT }}
          SKIP_TRENDS: ${{ inputs.skip_trends && '1' || '0' }}
        run: python scripts/collect.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "demand-radar-bot"
          git config user.email "demand-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten $(date -u +%F)"
            git push
          fi
